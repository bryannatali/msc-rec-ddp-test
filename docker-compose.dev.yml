version: '3.8'

# Development Docker Compose - runs Meteor in dev mode
services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: ddp-test-mongo-dev
    restart: unless-stopped
    volumes:
      - mongodb_data_dev:/data/db
    ports:
      - "27017:27017"
    networks:
      - ddp-network-dev

  # Meteor Development
  app:
    image: node:20-alpine
    container_name: ddp-test-app-dev
    working_dir: /app
    command: sh -c "apk add --no-cache curl bash && curl https://install.meteor.com/ | sh && meteor npm install && meteor run"
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongo:27017/ddp-test
      - METEOR_ALLOW_SUPERUSER=true
    depends_on:
      - mongo
    networks:
      - ddp-network-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.meteor/local

networks:
  ddp-network-dev:
    driver: bridge

volumes:
  mongodb_data_dev:
    driver: local

