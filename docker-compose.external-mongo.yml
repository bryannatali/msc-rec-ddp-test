version: '3.8'

# Use this compose file when connecting to existing MongoDB on the server
# Usage: docker-compose -f docker-compose.external-mongo.yml up -d

services:
  # Meteor Application (no MongoDB service)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddp-test-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Connect to MongoDB on host machine (change if needed)
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://host.docker.internal:27017/ddp-test
      - PORT=3000
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ddp-network
    volumes:
      - ./test-results:/app/test-results
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ddp-network:
    driver: bridge

